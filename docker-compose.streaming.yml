services:
  # =========================================================================
  # 1. Apache Kafka in KRaft mode (No Zookeeper required)
  # =========================================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: logshield-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    restart: unless-stopped

  # =========================================================================
  # 2. Kafka UI Dashboard
  # =========================================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: logshield-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-logshield
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped

  # =========================================================================
  # 3. LogShield Streaming Worker
  # =========================================================================
  streaming-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logshield-streaming-worker
    depends_on:
      - kafka
    command: ["python", "-m", "logshield", "stream", "--bootstrap-servers", "kafka:29092"]
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - LOGSHIELD_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    restart: unless-stopped
