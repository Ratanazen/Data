<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="logoBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="textCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Emblem (52x52) -->
  <g transform="translate(6, 6)">
    <rect width="52" height="52" rx="14" fill="url(#logoBg)"/>
    <rect x="1" y="1" width="50" height="50" rx="13" stroke="url(#logoBorder)" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Cyber Shield -->
    <path d="M26 8 L39 13 C39 28 26 39 26 44 C26 39 13 28 13 13 L26 8 Z" fill="#182235" stroke="url(#logoBorder)" stroke-width="1.8" stroke-linejoin="round" filter="url(#logoGlow)"/>
    <!-- Inner Diamond Core -->
    <path d="M26 16 L32 23 L26 30 L20 23 Z" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round" filter="url(#logoGlow)"/>
    <circle cx="26" cy="23" r="2.5" fill="#38BDF8"/>
    <!-- Trace Line -->
    <path d="M26 30 L26 37" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="26" cy="38" r="1.3" fill="#818CF8"/>
    <!-- Green telemetry pulse -->
    <circle cx="39" cy="11" r="2.2" fill="#34D399" filter="url(#logoGlow)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(70, 0)">
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5" fill="url(#textCyan)">Cyber AI</text>
    <!-- Version Pill -->
    <rect x="94" y="16" width="36" height="18" rx="9" fill="#06B6D4" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.4"/>
    <text x="112" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#38BDF8" text-anchor="middle">V2.0</text>
    <!-- Subtitle / Tagline -->
    <text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#94A3B8">DEFENSIVE SOC • HADOOP LAKEHOUSE</text>
  </g>
</svg>
