<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="clockGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="26" stroke="url(#clockGrad)" stroke-width="4" fill="#0f172a" filter="url(#clockGlow)"/>
  <!-- Clock ticks -->
  <line x1="32" y1="12" x2="32" y2="16" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="32" x2="48" y2="32" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="52" x2="32" y2="48" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="12" y1="32" x2="16" y2="32" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Clock hands pointing at 03:00 (Peak hour!) -->
  <line x1="32" y1="32" x2="32" y2="20" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="45" y2="32" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="4" fill="#f59e0b"/>
  <!-- 03:00 Peak Alert Dot -->
  <circle cx="45" cy="32" r="2.5" fill="#fef08a"/>
</svg>
