<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182235"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="neonGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base rounded container with cyber styling -->
  <rect width="64" height="64" rx="16" fill="url(#cyberBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#cyberBorder)" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Precision Cyber Shield -->
  <path d="M32 10 L48 16 C48 34 32 48 32 54 C32 48 16 34 16 16 L32 10 Z" fill="url(#shieldFill)" stroke="url(#cyberBorder)" stroke-width="2" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Inner Cyber Core (Geometric AI Diamond & Circuit Nodes) -->
  <path d="M32 20 L40 28 L32 36 L24 28 Z" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <circle cx="32" cy="28" r="3.2" fill="#38BDF8"/>
  <circle cx="32" cy="28" r="1.4" fill="#FFFFFF"/>

  <!-- Circuit Trace Lines & Telemetry Nodes -->
  <path d="M32 36 L32 45" stroke="#818CF8" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="32" cy="46" r="1.6" fill="#818CF8"/>

  <path d="M24 28 L19 28" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="18" cy="28" r="1.4" fill="#38BDF8"/>

  <path d="M40 28 L45 28" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="46" cy="28" r="1.4" fill="#38BDF8"/>

  <!-- Active Telemetry Status Ping (Emerald Core) -->
  <circle cx="48" cy="14" r="2.8" fill="#34D399" filter="url(#neonGlow)"/>
</svg>
