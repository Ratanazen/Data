<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <linearGradient id="bgBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="320" rx="16" fill="#0b1120" stroke="#334155" stroke-width="1.5"/>

  <!-- Grid pattern overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="150" y1="0" x2="150" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="450" y1="0" x2="450" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="750" y1="0" x2="750" y2="320"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
  </g>

  <!-- Node 1: Web Servers -->
  <g filter="url(#shadow)" transform="translate(30, 40)">
    <rect width="180" height="240" rx="12" fill="url(#bgBox)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="15" y="16" width="36" height="36" rx="8" fill="url(#accentBlue)"/>
    <path d="M25 34 L41 34 M25 28 L41 28 M25 40 L35 40" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Web Servers</text>
    <text x="60" y="48" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Apache / NGINX</text>

    <!-- Details -->
    <rect x="15" y="70" width="150" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="94" fill="#38bdf8" font-size="11" font-weight="bold" font-family="monospace">server.log</text>
    <text x="25" y="115" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• 200,000 requests</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Common Log Format</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• IP, Time, Status, Path</text>
    <rect x="25" y="175" width="130" height="30" rx="6" fill="#1e293b"/>
    <text x="35" y="194" fill="#f43f5e" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">🚨 43,153 (404 Errors)</text>
  </g>

  <!-- Flow 1 -> 2 Arrow -->
  <path d="M210 160 L245 160" stroke="#60a5fa" stroke-width="3" stroke-dasharray="6 3" stroke-linecap="round"/>
  <polygon points="245,155 255,160 245,165" fill="#60a5fa"/>

  <!-- Node 2: Hadoop HDFS -->
  <g filter="url(#shadow)" transform="translate(255, 40)">
    <rect width="180" height="240" rx="12" fill="url(#bgBox)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="15" y="16" width="36" height="36" rx="8" fill="url(#accentOrange)"/>
    <circle cx="33" cy="34" r="8" stroke="#ffffff" stroke-width="2"/>
    <text x="60" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Hadoop HDFS</text>
    <text x="60" y="48" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Distributed Store</text>

    <!-- Details -->
    <rect x="15" y="70" width="150" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="94" fill="#fbbf24" font-size="11" font-weight="bold" font-family="monospace">hdfs://namenode:9000</text>
    <text x="25" y="115" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• 128MB Block Chunks</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• 3x Fault Replication</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• NameNode Metadata</text>
    <rect x="25" y="175" width="130" height="30" rx="6" fill="#1e293b"/>
    <text x="35" y="194" fill="#fbbf24" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">🛡️ High Availability</text>
  </g>

  <!-- Flow 2 -> 3 Arrow -->
  <path d="M435 160 L470 160" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 3" stroke-linecap="round"/>
  <polygon points="470,155 480,160 470,165" fill="#f59e0b"/>

  <!-- Node 3: Apache PySpark -->
  <g filter="url(#shadow)" transform="translate(480, 40)">
    <rect width="180" height="240" rx="12" fill="url(#bgBox)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="15" y="16" width="36" height="36" rx="8" fill="url(#accentRed)"/>
    <path d="M33 22 L37 32 L47 34 L39 42 L41 52 L33 46 L25 52 L27 42 L19 34 L29 32 Z" fill="#ffffff" transform="scale(0.6) translate(18, 12)"/>
    <text x="60" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Apache PySpark</text>
    <text x="60" y="48" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Distributed Compute</text>

    <!-- Details -->
    <rect x="15" y="70" width="150" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="94" fill="#f87171" font-size="11" font-weight="bold" font-family="monospace">DataFrame API</text>
    <text x="25" y="115" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• F.regexp_extract()</text>
    <text x="25" y="135" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Catalyst & Tungsten</text>
    <text x="25" y="155" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• In-Memory .cache()</text>
    <rect x="25" y="175" width="130" height="30" rx="6" fill="#1e293b"/>
    <text x="35" y="194" fill="#f87171" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">⚡ Parallel Shuffle</text>
  </g>

  <!-- Flow 3 -> 4 Arrow -->
  <path d="M660 160 L695 160" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 3" stroke-linecap="round"/>
  <polygon points="695,155 705,160 695,165" fill="#ef4444"/>

  <!-- Node 4: Web Dashboard & Outputs -->
  <g filter="url(#shadow)" transform="translate(705, 40)">
    <rect width="165" height="240" rx="12" fill="url(#bgBox)" stroke="#10b981" stroke-width="1.5"/>
    <rect x="15" y="16" width="36" height="36" rx="8" fill="url(#accentGreen)"/>
    <rect x="23" y="24" width="20" height="15" rx="2" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="28" y1="43" x2="38" y2="43" stroke="#ffffff" stroke-width="2"/>
    <text x="60" y="32" fill="#ffffff" font-size="14" font-weight="bold" font-family="system-ui, sans-serif">Dashboard</text>
    <text x="60" y="48" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif">Web & Analytics</text>

    <!-- Details -->
    <rect x="15" y="70" width="135" height="150" rx="8" fill="#0f172a" stroke="#1e293b"/>
    <text x="23" y="94" fill="#34d399" font-size="11" font-weight="bold" font-family="monospace">index.html (Web)</text>
    <text x="23" y="115" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• 24h Hourly Trend</text>
    <text x="23" y="135" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• 7x24 Day Heatmap</text>
    <text x="23" y="155" fill="#cbd5e1" font-size="10" font-family="system-ui, sans-serif">• Interactive Explorer</text>
    <rect x="23" y="175" width="119" height="30" rx="6" fill="#1e293b"/>
    <text x="30" y="194" fill="#34d399" font-size="10" font-weight="bold" font-family="system-ui, sans-serif">📊 Live Chart.js</text>
  </g>
</svg>
