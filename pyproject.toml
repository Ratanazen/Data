[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "log-file-analysis-pyspark"
version = "1.0.0"
description = "Hadoop & Apache PySpark 404 Error Log Analysis Pipeline & Interactive Web Dashboard"
authors = [
    { name = "Ratanazen", email = "Rtnaeam611@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.0"
]
test = [
    "pytest>=7.0.0"
]

[project.scripts]
logshield = "src.logshield.cli.main:main"
log-analysis = "run_analysis:main"
log-web = "serve:run_server"

[tool.setuptools.packages.find]
where = ["."]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py311']
