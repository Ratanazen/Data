services:
  logshield-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logshield-dashboard
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - LOGSHIELD_PORT=8080
    restart: unless-stopped

  logshield-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: logshield-api
    command: ["uvicorn", "src.logshield.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - LOGSHIELD_HOST=0.0.0.0
      - LOGSHIELD_PORT=8000
    restart: unless-stopped

